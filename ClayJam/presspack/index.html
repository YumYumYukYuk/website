        <div class="w-html-embed">
          <style>
            /* Drawer base styles (closed by default) */
            #menuPanel {
              transform: translateX(-100%);
              transition: transform 666ms cubic-bezier(0.2, 1, 0.2, 1);
              will-change: transform;
            }

            /* Open state */
            #menuPanel.is-open {
              transform: translateX(0);
            }

            /* Optional overlay support */
            #menuOverlay {
              opacity: 0;
              pointer-events: none;
              transition: opacity 200ms ease;
            }

            #menuOverlay.is-open {
              opacity: 1;
              pointer-events: auto;
            }

            /* Debug badge */
            #wsDrawerDebug {
              position: fixed;
              bottom: 12px;
              left: 12px;
              z-index: 99999;
              font:
                12px/1.2 system-ui,
                sans-serif;
              padding: 6px 8px;
              border-radius: 8px;
              background: rgba(0, 0, 0, 0.75);
              color: #fff;
            }
          </style>

          <script>
            (function () {
              const DEBUG = false;
              const LOCK_SCROLL = false; // change to true to disable background scrolling when menu is open

              const SESSION_KEY = "menuHasVisited";
              const MENU_STATE_KEY = "menuWasOpenOnLastPage";

              const ids = {
                toggleBtn: "menuToggleBtn",
                panel: "menuPanel",
                overlay: "menuOverlay",
                img: "menuToggleImg",
              };

              const images = {
                hamburger: "https://yumyumyukyuk.com/UI/Hamburger.png",
                hamburgerHover:
                  "https://yumyumyukyuk.com/UI/HamburgerRollover.png",
                exit: "https://yumyumyukyuk.com/UI/Exit.png",
                exitHover: "https://yumyumyukyuk.com/UI/ExitRollover.png",
                openAnim: "https://yumyumyukyuk.com/UI/HamburgerToExit.gif",
                closeAnim: "https://yumyumyukyuk.com/UI/ExitToHamburger.gif",
              };

              const timings = {
                openAnimMs: 666,
                closeAnimMs: 666,
                autoCloseDelayMs: 50, // tiny delay so the open state is visible before auto-closing
              };

              Object.values(images).forEach((src) => {
                const preload = new Image();
                preload.src = src;
              });

              function setBadge(text) {
                if (!DEBUG) return;
                let badge = document.getElementById("wsDrawerDebug");
                if (!badge) {
                  badge = document.createElement("div");
                  badge.id = "wsDrawerDebug";
                  document.body.appendChild(badge);
                }
                badge.textContent = text;
              }

              if (!DEBUG) {
                const old = document.getElementById("wsDrawerDebug");
                if (old) old.remove();
              }

              const btn = document.getElementById(ids.toggleBtn);
              const panel = document.getElementById(ids.panel);
              const overlay = document.getElementById(ids.overlay);

              const imgNode = document.getElementById(ids.img);
              const img =
                imgNode && imgNode.tagName === "IMG"
                  ? imgNode
                  : imgNode
                    ? imgNode.querySelector("img")
                    : null;

              setBadge(
                "Menu script: " +
                  (btn ? "btn✅ " : "btn❌ ") +
                  (panel ? "panel✅ " : "panel❌ ") +
                  (overlay ? "overlay✅ " : "overlay(—) ") +
                  (img ? "img✅" : "img❌"),
              );

              if (!btn || !panel || !img) return;

              let isOpen = false;
              let isAnimating = false;

              function setClosedIdle() {
                img.src = images.hamburger;
              }

              function setOpenIdle() {
                img.src = images.exit;
              }

              function lockScroll() {
                if (!LOCK_SCROLL) return;
                document.body.style.overflow = "hidden";
                document.documentElement.style.overflow = "hidden";
              }

              function unlockScroll() {
                if (!LOCK_SCROLL) return;
                document.body.style.overflow = "";
                document.documentElement.style.overflow = "";
              }

              function openDrawerVisuals() {
                panel.classList.add("is-open");
                if (overlay) overlay.classList.add("is-open");
                lockScroll();
              }

              function closeDrawerVisuals() {
                panel.classList.remove("is-open");
                if (overlay) overlay.classList.remove("is-open");
                unlockScroll();
              }

              function openMenu() {
                if (isAnimating || isOpen) return;

                isAnimating = true;
                img.src = images.openAnim;
                openDrawerVisuals();
                setBadge("Drawer: OPENING");

                window.setTimeout(() => {
                  setOpenIdle();
                  isOpen = true;
                  isAnimating = false;
                  sessionStorage.setItem(MENU_STATE_KEY, "true");
                  setBadge("Drawer: OPEN ✅");
                }, timings.openAnimMs);
              }

              function closeMenu() {
                if (isAnimating || !isOpen) return;

                isAnimating = true;
                img.src = images.closeAnim;
                closeDrawerVisuals();
                setBadge("Drawer: CLOSING");

                window.setTimeout(() => {
                  setClosedIdle();
                  isOpen = false;
                  isAnimating = false;
                  sessionStorage.setItem(MENU_STATE_KEY, "false");
                  setBadge("Drawer: CLOSED ✅");
                }, timings.closeAnimMs);
              }

              function toggleMenu() {
                if (isOpen) closeMenu();
                else openMenu();
              }

              btn.onclick = null;
              btn.onmouseenter = null;
              btn.onmouseleave = null;
              if (overlay) overlay.onclick = null;

              btn.addEventListener("click", toggleMenu);

              btn.addEventListener("mouseenter", () => {
                if (isAnimating) return;
                img.src = isOpen ? images.exitHover : images.hamburgerHover;
              });

              btn.addEventListener("mouseleave", () => {
                if (isAnimating) return;
                img.src = isOpen ? images.exit : images.hamburger;
              });

              if (overlay) {
                overlay.addEventListener("click", () => {
                  if (isAnimating || !isOpen) return;
                  closeMenu();
                });
              }

              document.addEventListener("keydown", (e) => {
                if (e.key === "Escape" && isOpen && !isAnimating) {
                  closeMenu();
                }
              });

              const hasVisited = sessionStorage.getItem(SESSION_KEY) === "true";
              const menuWasOpenOnLastPage =
                sessionStorage.getItem(MENU_STATE_KEY) === "true";

              if (!hasVisited) {
                // First landing on the whole site this session: force closed
                closeDrawerVisuals();
                setClosedIdle();
                isOpen = false;
                isAnimating = false;
                sessionStorage.setItem(SESSION_KEY, "true");
                sessionStorage.setItem(MENU_STATE_KEY, "false");
              } else if (menuWasOpenOnLastPage) {
                // Subsequent page load: briefly show open, then auto-close
                openDrawerVisuals();
                setOpenIdle();
                isOpen = true;
                isAnimating = false;

                window.setTimeout(() => {
                  closeMenu();
                }, timings.autoCloseDelayMs);
              } else {
                // Normal closed load
                closeDrawerVisuals();
                setClosedIdle();
                isOpen = false;
                isAnimating = false;
              }

              setBadge(
                DEBUG
                  ? document.getElementById("wsDrawerDebug").textContent +
                      " | bound✅"
                  : "",
              );
            })();
          </script>
